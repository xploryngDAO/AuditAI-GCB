name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Local seed (database_store.json)
        run: npm run seed:local

      - name: Validate local seed
        run: npm run seed:local:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  db-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: stage3
          POSTGRES_DB: auditai_stage3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auditai_stage3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STAGE3_DATABASE_URL: postgresql://postgres:stage3@127.0.0.1:5432/auditai_stage3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply Estágio 3 migrations
        run: npx drizzle-kit migrate

      - name: Verify schema and RLS
        run: npm run db:verify
